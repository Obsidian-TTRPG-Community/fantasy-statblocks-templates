name: Template submission to PR

# When a "Submit a statblock template" issue is filed, build the template files
# and open a pull request for a maintainer to review. Uses only GitHub-owned
# actions plus the preinstalled gh CLI (no third-party actions), so it runs
# under a restrictive Actions allow-list.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    # Issues created from the submission form get a "[Template] ..." title.
    if: startsWith(github.event.issue.title, '[Template]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build template files from the submission
        id: build
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/build-submission.mjs

      - name: Commit and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          NAME: ${{ steps.build.outputs.name }}
          BRANCH: ${{ steps.build.outputs.branch }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Add community template: ${NAME} (#${ISSUE})"
          git push -f origin "$BRANCH"
          gh label create template-submission --color 0e8a16 --description "Community template submission" 2>/dev/null || true
          gh pr create --base main --head "$BRANCH" \
            --title "Template submission: ${NAME}" \
            --body-file .github/submission-pr-body.md \
            --label template-submission 2>/dev/null || \
          gh pr create --base main --head "$BRANCH" \
            --title "Template submission: ${NAME}" \
            --body-file .github/submission-pr-body.md

      - name: Comment on the issue if it failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body "⚠️ Automated processing of this submission failed. A maintainer will take a look — check the form fields (especially the Layout JSON) for errors."
